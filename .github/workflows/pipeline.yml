name: simple cice pipeline

on:
  workflow_call:
    inputs:
      pullimage:
        required: false
        type: boolean
        default: false
      tagimage:
        required: false
        type: boolean
        default: false
      pushimage:
        required: false
        type: boolean
        default: false

    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

jobs:

  image_pull:
    if: ${{ inputs.pullimage }}
    runs-on: ubuntu-latest
    steps:
      - name: Pull nginx image
        run: docker pull nginx

  image_tag:
    if: ${{ inputs.tagimage }}
    runs-on: ubuntu-latest
    needs: image_pull
    steps:
      - name: Tag image for ECR
        run: |
          docker tag nginx:latest 123456789012.dkr.ecr.ap-south-1.amazonaws.com/nginx:latest

  image_push:
    if: ${{ inputs.pushimage }}
    runs-on: ubuntu-latest
    needs: image_tag
    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 123456789012.dkr.ecr.ap-south-1.amazonaws.com

      - name: Push image to ECR
        run: |
          docker push 123456789012.dkr.ecr.ap-south-1.amazonaws.com/nginx:latest
